name: Demo Data Smoke

on:
  workflow_dispatch:
    inputs:
      demo_pmtiles_url:
        description: 'PMTiles fixture URL'
        required: true
        type: string
      demo_pmtiles_sha256:
        description: 'Optional PMTiles SHA-256 checksum'
        required: false
        type: string

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.4.1'
  VALHALLA_BUILDER_IMAGES: 'ghcr.io/planisfy/valhalla@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  PLANETILER_BUILDER_IMAGES: 'ghcr.io/planisfy/planetiler@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'

permissions:
  contents: read

jobs:
  demo-data-smoke:
    name: PMTiles Compose Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare demo data
        env:
          DEMO_PMTILES_SHA256: ${{ inputs.demo_pmtiles_sha256 }}
          DEMO_PMTILES_URL: ${{ inputs.demo_pmtiles_url }}
        run: pnpm self-host:setup --demo-data

      - name: Compose smoke with PMTiles
        run: pnpm smoke:self-host-compose
