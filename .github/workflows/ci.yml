name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/marketing/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.4.1'
  GOOGLE_CLIENT_ID: 'test-client-id'
  GOOGLE_CLIENT_SECRET: 'test-client-secret'
  VALHALLA_BUILDER_IMAGES: 'ghcr.io/planisfy/valhalla@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  PLANETILER_BUILDER_IMAGES: 'ghcr.io/planisfy/planetiler@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'

jobs:
  lint-and-typecheck:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  docker-build:
    name: Docker Build - ${{ matrix.app }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: console
            dockerfile: apps/console/Dockerfile
          - app: admin
            dockerfile: apps/admin/Dockerfile
          - app: docs
            dockerfile: apps/docs/Dockerfile
          - app: marketing
            dockerfile: apps/marketing/Dockerfile
          - app: worker-geodata
            dockerfile: apps/worker-geodata/Dockerfile
          - app: worker-billing
            dockerfile: apps/worker-billing/Dockerfile
          - app: elevation
            dockerfile: apps/elevation/Dockerfile
          - app: static-renderer
            dockerfile: apps/static-renderer/Dockerfile
          - app: tile-worker
            dockerfile: apps/tile-worker/Dockerfile
          - app: self-host-supervisor
            dockerfile: apps/self-host-supervisor/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Docker Publish - ${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: console
            dockerfile: apps/console/Dockerfile
          - app: admin
            dockerfile: apps/admin/Dockerfile
          - app: docs
            dockerfile: apps/docs/Dockerfile
          - app: worker-geodata
            dockerfile: apps/worker-geodata/Dockerfile
          - app: worker-billing
            dockerfile: apps/worker-billing/Dockerfile
          - app: elevation
            dockerfile: apps/elevation/Dockerfile
          - app: static-renderer
            dockerfile: apps/static-renderer/Dockerfile
          - app: tile-worker
            dockerfile: apps/tile-worker/Dockerfile
          - app: self-host-supervisor
            dockerfile: apps/self-host-supervisor/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm --filter static-renderer exec playwright install --with-deps chromium

      - name: Non-binary self-host smoke
        env:
          SMOKE_BROWSER_PRODUCT_LOOP: 'true'
          PLANISFY_E2E_ALLOW_MISSING_TILESET: 'true'
        run: pnpm smoke:self-host-compose
