name: Self-Host Backup Restore Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/self-host-backup-restore-smoke.yml'
      - 'apps/api/**'
      - 'apps/console/**'
      - 'apps/worker-geodata/**'
      - 'infra/docker/**'
      - 'packages/database/**'
      - 'packages/storage/**'
      - 'scripts/browser-smoke-lib.mjs'
      - 'scripts/dev-seed.ts'
      - 'scripts/product-loop-full-browser-smoke.mjs'
      - 'scripts/self-host-backup.sh'
      - 'scripts/self-host-restore.sh'
      - 'scripts/self-host-setup.sh'
      - 'scripts/self-host-backup-restore-smoke.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.4.1'

permissions:
  contents: read

jobs:
  backup-restore:
    name: Self-Host Backup Restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm --filter static-renderer exec playwright install --with-deps chromium

      - name: Run backup/restore smoke
        run: pnpm smoke:self-host-backup-restore

      - name: Upload backup/restore diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-host-backup-restore-diagnostics
          path: dogfood-output/self-host-backup-restore
          if-no-files-found: ignore
