name: Product Loop Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.4.1'
  VALHALLA_BUILDER_IMAGES: 'ghcr.io/planisfy/valhalla@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  PLANETILER_BUILDER_IMAGES: 'ghcr.io/planisfy/planetiler@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'

permissions:
  contents: read

jobs:
  full-product-loop:
    name: Full Browser Product Loop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm --filter static-renderer exec playwright install --with-deps chromium

      - name: Prepare self-host stack
        run: pnpm self-host:setup

      - name: Start product-loop services
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml --profile with-minio up -d postgres redis martin minio minio-init api console worker-geodata worker-billing

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run full browser product-loop smoke
        run: pnpm e2e:product-loop:full

      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p dogfood-output/compose
          docker compose --env-file .env -f infra/docker/docker-compose.yml --profile with-minio logs --no-color postgres redis martin minio minio-init pelias pelias-elasticsearch elevation api console worker-geodata worker-billing > dogfood-output/compose/product-loop-smoke.log

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-loop-smoke-screenshots
          path: dogfood-output/screenshots
          if-no-files-found: ignore

      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-loop-smoke-compose-logs
          path: dogfood-output/compose
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml down -v --remove-orphans
